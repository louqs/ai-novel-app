{% extends "base.html" %}
{% block title %}知识包市场{% endblock %}{% block page_title %}知识包市场{% endblock %}
{% block content %}
<div class="page-header"><h1>📦 知识包市场</h1><p class="subtitle">安装写作技巧包到 <code>knowledge_base/packs/</code>，重启不丢，自动索引供AI检索</p></div>
<div class="card">
    <div class="section-header">
        <h2>内置知识包</h2>
        <div>
            <button class="btn btn-sm" onclick="updateKnowledge()" style="margin-right:8px">🔄 更新知识库</button>
            <button class="btn btn-sm" onclick="refreshPacks()">刷新索引</button>
        </div>
    </div>
    <div id="catalog-list"><p class="muted">加载中...</p></div>
</div>
<div class="card"><h2>已安装</h2><div id="local-list"><p class="muted">加载中...</p></div></div>
{% endblock %}

{% block scripts %}
<script src="/static/packs_page.js"></script>
{% endblock %}
