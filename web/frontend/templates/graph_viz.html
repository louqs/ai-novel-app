{% extends "base.html" %}
{% block title %}人物关系图谱{% endblock %}{% block nav_graph %}active{% endblock %}{% block page_title %}人物关系图谱{% endblock %}
{% block head %}<script src="/static/d3.v7.min.js"></script>{% endblock %}

{% block content %}
<div class="page-header"><h1>🕸️ 人物关系图谱</h1><p class="subtitle">D3.js 力导向图 — 拖拽节点、滚轮缩放</p></div>
<div class="card" style="padding:0;overflow:hidden">
    <div id="full-graph" style="width:100%;height:70vh;background:var(--bg)"></div>
</div>
<div class="card">
    <div class="section-header"><h2>图例</h2><div style="display:flex;gap:8px"><button class="btn btn-sm" onclick="loadFullGraph()">🔄 刷新</button><button class="btn btn-primary btn-sm" onclick="exportGraphPNG()">📥 导出 PNG</button></div></div>
    <div id="legend" class="plugin-tags"></div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/graph_viz.js"></script>
{% endblock %}
