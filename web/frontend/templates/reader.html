<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>阅读模式 - 阅读模式</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#faf8f5;--text:#2c2c2c;--text-muted:#888;--accent:#6b4ce6;--border:#e8e4de;--surface:#fff}
body{background:var(--bg);color:var(--text);font-family:"Noto Serif SC","Source Han Serif SC","Songti SC",Georgia,"Times New Roman",serif;line-height:1.9;font-size:16px}
.reader-header{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;justify-content:space-between;align-items:center}
.reader-header h1{font-size:16px;font-weight:600;color:var(--text)}
.reader-header .nav{display:flex;gap:8px;align-items:center}
.reader-header .nav a{color:var(--text-muted);text-decoration:none;font-size:13px;padding:4px 10px;border:1px solid var(--border);border-radius:6px;transition:all 0.15s}
.reader-header .nav a:hover{border-color:var(--accent);color:var(--accent)}
.reader-header select{padding:4px 8px;border:1px solid var(--border);border-radius:6px;background:var(--surface);font-size:13px;color:var(--text);outline:none}
.reader-body{max-width:680px;margin:0 auto;padding:40px 24px 80px}
.reader-body h2{font-size:22px;font-weight:700;margin-bottom:24px;text-align:center;color:var(--text);letter-spacing:2px}
.reader-body .chapter-meta{text-align:center;font-size:12px;color:var(--text-muted);margin-bottom:32px}
.reader-body p{text-indent:2em;margin-bottom:0.8em;text-align:justify}
.reader-body .chapter-end{text-align:center;color:var(--text-muted);margin:48px 0;font-size:14px;letter-spacing:4px}
.reader-nav-bottom{max-width:680px;margin:0 auto;padding:0 24px 60px;display:flex;justify-content:space-between}
.reader-nav-bottom a{color:var(--accent);text-decoration:none;font-size:14px;padding:8px 20px;border:1px solid var(--accent);border-radius:8px;transition:all 0.15s}
.reader-nav-bottom a:hover{background:var(--accent);color:#fff}
.reader-nav-bottom a.disabled{color:var(--text-muted);border-color:var(--border);pointer-events:none}
.word-info{text-align:center;font-size:12px;color:var(--text-muted);margin:16px 0}
.toc-panel{display:none;position:fixed;top:0;left:0;width:280px;height:100%;background:var(--surface);border-right:1px solid var(--border);z-index:100;overflow-y:auto;padding:20px}
.toc-panel.open{display:block}
.toc-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.3);z-index:99}
.toc-overlay.open{display:block}
.toc-item{padding:8px 12px;cursor:pointer;border-radius:6px;font-size:13px;margin:2px 0;transition:background 0.15s}
.toc-item:hover{background:var(--bg)}
.toc-item.active{color:var(--accent);font-weight:600}
.toc-vol{font-weight:700;font-size:14px;color:var(--accent);margin:12px 0 4px}
@media(max-width:768px){.reader-body{padding:20px 16px 60px}.reader-header h1{font-size:14px}}
</style>
</head>
<body>
<div class="reader-header">
    <div style="display:flex;align-items:center;gap:12px">
        <a href="javascript:toggleTOC()" style="font-size:18px;text-decoration:none;color:var(--text)">☰</a>
        <h1>阅读模式</h1>
    </div>
    <div class="nav">
        <a href="javascript:navigateChapter(-1)">← 上一章</a>
        <select id="chapter-select" onchange="jumpToChapter(this.value)"></select>
        <a href="javascript:navigateChapter(1)">下一章 →</a>
        <a href="/workbench?project_id={{ project_id }}" style="margin-left:8px">返回工作台</a>
    </div>
</div>

<!-- 目录侧栏 -->
<div class="toc-overlay" id="toc-overlay" onclick="toggleTOC()"></div>
<div class="toc-panel" id="toc-panel"></div>

<div class="reader-body" id="reader-content">
    <p style="text-align:center;color:var(--text-muted)">加载中...</p>
</div>

<div class="reader-nav-bottom">
    <a href="javascript:navigateChapter(-1)" id="nav-prev">← 上一章</a>
    <a href="javascript:navigateChapter(1)" id="nav-next">下一章 →</a>
</div>

<script src="/static/reader.js"></script>
</body>
</html>
