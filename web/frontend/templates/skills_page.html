{% extends "base.html" %}
{% block title %}Skill Builder{% endblock %}{% block page_title %}AI 自我扩展{% endblock %}
{% block content %}
<div class="page-header"><h1>Skill Builder</h1><p class="subtitle">AI生成插件保存到 <code>plugins/_built/</code>，重启不丢。门禁插件自动在章节生成时生效。</p></div>

<div class="card"><h2>创建新插件</h2>
    <textarea id="requirement" rows="3" placeholder="描述你需要的插件功能，例如：写一个检测战斗场面描写是否过于平淡的插件" style="width:100%;padding:12px;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:6px;font-size:14px;line-height:1.6;resize:vertical;font-family:inherit"></textarea>
    <button class="btn btn-primary" onclick="buildSkill()" style="margin-top:8px">生成插件</button>
    <div id="progress-box" style="display:none;margin-top:8px">
        <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:2px"><span id="progress-step" class="muted"></span><span id="progress-pct" class="muted"></span></div>
        <div style="height:4px;background:var(--border);border-radius:2px"><div id="progress-fill" style="height:100%;width:0;background:var(--accent);border-radius:2px;transition:width 0.5s"></div></div>
    </div>
    <div id="build-result" style="margin-top:8px"></div>
</div>

<div class="card">
    <div class="section-header"><h2>已生成的插件</h2><span class="muted">门禁类自动应用到章节生成</span></div>
    <div id="built-list"></div>
    <div id="delete-bar" style="display:none;margin-top:4px;height:3px;background:var(--border);border-radius:2px"><div id="delete-fill" style="height:100%;width:0;background:var(--bad);border-radius:2px;transition:width 0.3s"></div></div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/skills_page.js"></script>
{% endblock %}
