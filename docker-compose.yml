version: "3.8"

services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - NOVEL_ENV=production
      - NOVEL_LOG_LEVEL=INFO
    volumes:
      - ./novel_output:/app/novel_output
      - ./data:/app/data
      - ./config:/app/config
      - ./knowledge_base:/app/knowledge_base
    restart: unless-stopped

