# AI 写作模式特征库
# 来源: NovelForge Tic Defense、Antislop Framework、行业研究
# 版本: v1.0
---

patterns:
  # =========================================================================
  # 类别 1: 高频 AI 词汇
  # =========================================================================
  high_freq_ai_words:
    severity: high
    threshold: 3_per_1000_chars
    words:
      - "不禁"
      - "仿佛"
      - "映入眼帘"
      - "与此同时"
      - "诚然"
      - "总而言之"
      - "不可否认"
      - "值得注意"
    fix: 替换为具体的动作描写

  # =========================================================================
  # 类别 2: 弱化副词过量
  # =========================================================================
  weak_adverbs:
    severity: medium
    threshold: 3_per_1000_chars
    words:
      - "微微"
      - "淡淡"
      - "缓缓"
      - "轻轻"
      - "稍稍"
      - "略略"
      - "隐隐"
    fix: 删除或用具体动作替代

  # =========================================================================
  # 类别 3: 意义膨胀
  # =========================================================================
  meaning_inflation:
    severity: medium
    patterns:
      - "意义深远"
      - "前所未有"
      - "空前绝后"
      - "无与伦比"
      - "不可磨灭"
      - "永载史册"
    fix: 替换为具体后果

  # =========================================================================
  # 类别 4: 泛化结尾
  # =========================================================================
  generic_endings:
    severity: high
    patterns:
      - "未来的路还很长"
      - "新的征程即将开始"
      - "充满希望"
      - "未来可期"
      - "新的篇章"
      - "这只是开始"
    fix: 替换为具体悬念/冲突

  # =========================================================================
  # 类别 5: 议论文结构
  # =========================================================================
  essay_patterns:
    severity: medium
    patterns:
      - "不难看出"
      - "由此可见"
      - "综上所述"
      - "总的来说"
      - "从某种程度上"
      - "毋庸置疑"
    fix: 直接写事实，删除引导词

  # =========================================================================
  # 类别 6: 正式语域
  # =========================================================================
  formal_register:
    severity: medium
    patterns:
      - "与此同时"
      - "换言之"
      - "此外"
      - "从而"
      - "并且"
    fix: 口语化或删除

  # =========================================================================
  # 类别 7: 排比句过量
  # =========================================================================
  triplet_overload:
    severity: low
    description: 三联排比类型
    fix: 选一个具体细节展开

  # =========================================================================
  # 类别 8: 均匀句长
  # =========================================================================
  uniform_sentence_length:
    severity: high
    description: 句长标准差 SD < 4 是强 AI 信号
    fix: 刻意变化句长 — 长句分析后接短句炸裂

  # =========================================================================
  # 类别 9: 低困惑度
  # =========================================================================
  low_perplexity:
    severity: high
    description: 文本对生成模型而言"过于可预测"
    fix: 增加感知细节、主观表达、不完美痕迹

  # =========================================================================
  # 类别 10: 缺乏感知细节
  # =========================================================================
  lacking_sensory:
    severity: medium
    description: 缺少五感描写 (视/听/嗅/味/触)
    fix: 在关键时刻插入 1-2 个感官细节
