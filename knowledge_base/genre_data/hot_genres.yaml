  - name: 脑洞·科技霸权
    platform: qidian
    audience: 25-40岁男性，高知读者
    heat: ★★★★☆
    description: 摒弃传统系统文，强调主角凭借自身知识或“黑科技图纸”进行工业逆袭。从芯片、光刻机到生物制药，硬核科普与大国崛起叙事结合，满足读者对“国运昌隆”的期待。
    keywords: [黑科技, 工业文, 大国重工, 学霸, 科技兴国, 硬核]
